<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>自習ミッション</title>
<style>
:root{--bg:#F7F6F2;--card:#FFFFFF;--ink:#1F2430;--sub:#4A5160;--line:#D9D6CC;--blue:#1F4E79;--blue-soft:#E0EAF4;--org:#C2410C;--org-soft:#FBE7DE;--green:#2F6B3A;--green-soft:#E3F0E3;--gold:#6B4A06;--gold-soft:#F5ECD2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 8px}
.sub{font-size:14px;color:var(--sub);margin:0 0 14px}
.door{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.door:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
.door:active{background:var(--blue-soft)}
.door h2{font-size:19px;margin:0 0 4px;color:var(--blue)}
.door p{font-size:14px;color:var(--sub);margin:0 0 8px}
.prog{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700}
.chip{padding:4px 10px;border-radius:99px}
.chip.pt{background:var(--gold-soft);color:var(--gold)}
.chip.box{background:var(--blue-soft);color:var(--blue)}
.go{display:block;margin-top:8px;font-size:15px;font-weight:700;color:var(--blue);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note{font-size:13px;color:var(--sub)}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue)}
.fb{border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.fb.ok{background:var(--green-soft);border:1px solid var(--green);color:#1F3B25}
.fb.ng{background:var(--org-soft);border:1px solid var(--org);color:#7A2A08}
button{font-family:inherit;font-size:15px;font-weight:700;min-height:46px;border-radius:10px;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:0 14px;cursor:pointer}
button.main{background:var(--blue);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
input{width:100%;min-height:46px;font-size:16px;padding:0 10px;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const ZK = 'zukei-mission-v1', JK = 'joken-hunter-v1', SK = 'shiryo-tsunagi-v1', TK = 'tsumiki-dansu-v1', KK = 'kotoba-dojo-v1', PK = 'kotoba-tempo-v1', RK = 'jishu-reward-v1';
const rd = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 進み具合
function zInfo() {
  const z = rd(ZK); let g = 0;
  if (z && z.done) Object.values(z.done).forEach(a => { g += (a || []).reduce((x, y) => x + y, 0); });
  return { pt: z && +z.pt || 0, got: g, n: 60 };
}
function listInfo(k, n) {
  const j = rd(k);
  return { pt: j && +j.pt || 0, got: j && Array.isArray(j.done) ? j.done.reduce((x, y) => x + y, 0) : 0, n };
}
const jInfo = () => listInfo(JK, 22), sInfo = () => listInfo(SK, 20), tInfo = () => listInfo(TK, 21), kInfo = () => listInfo(KK, 18), pInfo = () => { const o = rd(PK); return { pt: o && +o.pt || 0, known: o && o.box ? Object.values(o.box).filter(v => v >= 3).length : 0 }; };
// ごほうび（すべてのアプリで共通）。はじめて読むとき、図形ミッションの旧設定を引き継ぐ
function reward() {
  let r = rd(RK);
  if (!r || typeof r !== 'object') {
    const z = rd(ZK);
    r = { text: (z && z.reward && z.reward.text) || '', need: (z && z.reward && +z.reward.need) || 300, spent: (z && +z.spent) || 0 };
    saveReward(r);
  }
  return r;
}
function saveReward(r) { try { localStorage.setItem(RK, JSON.stringify(r)); } catch (e) {} }
const total = () => zInfo().pt + jInfo().pt + sInfo().pt + tInfo().pt + kInfo().pt + pInfo().pt;
const haveNow = r => Math.max(0, total() - (+r.spent || 0));

function testChip() {
  const d = rd('jishu-test-v1'), h = d && Array.isArray(d.hist) && d.hist[0];
  return h ? `<span class="chip box">前回 ${h.solved} / ${h.n} 問 解けた</span>` : '<span class="chip box">まだ、していません</span>';
}
let gate = 0;
function renderHub() {
  const z = zInfo(), j = jInfo(), s = sInfo(), t = tInfo(), k = kInfo(), pp = pInfo(), r = reward(), need = Math.max(1, +r.need || 1), have = haveNow(r), pct = Math.min(100, Math.round(have / need * 100));
  const chips = i => `<span class="chip pt">${i.pt} pt</span><span class="chip box">宝箱 ${i.got} / ${i.n}</span>`;
  app.innerHTML = `<h1>自習ミッション</h1>
  <p class="sub">どれから始める？　ポイントは、ぜんぶ合わせてたまります。</p>
  <a class="door" href="zukei/"><h2>図形ミッション</h2><p>立体の切断・展開図・反射の作図・補助線。動かして確かめよう。</p><div class="prog">${chips(z)}</div><span class="go">はじめる →</span></a>
  <a class="door" href="joken/"><h2>条件ハンター</h2><p>問題文にかくれた「答えをかえる条件」を見つけて、しるしをつけてから解こう。</p><div class="prog">${chips(j)}</div><span class="go">はじめる →</span></a>
  <a class="door" href="shiryo/"><h2>資料つなぎ</h2><p>2つの資料の「同じものについて書いてある項目」を、自分でつないでから解こう。</p><div class="prog">${chips(s)}</div><span class="go">はじめる →</span></a>
  <a class="door" href="tsumiki/"><h2>積み木の段数</h2><p>見える数・いちばん多い数と少ない数・ふえるきまり。書きこんで、きまりに切りかえよう。</p><div class="prog">${chips(t)}</div><span class="go">はじめる →</span></a>
  <a class="door" href="kotoba/"><h2>ことば道場</h2><p>慣用句・ことわざを、「この文では、どういう意味？」と言いかえて解こう。3つのステージ。</p><div class="prog">${chips(k)}</div><span class="go">はじめる →</span></a>
  <a class="door" href="tempo/"><h2>ことばテンポ</h2><p>慣用句・ことわざ・四字熟語を、1問ずつ、テンポよく。まちがえた語は、何度でも出る。</p><div class="prog"><span class="chip pt">${pp.pt} pt</span><span class="chip box">覚えた ${pp.known} / 406</span></div><span class="go">はじめる →</span></a>
  <a class="door" href="test/"><h2>テスト</h2><p>クリアした問題から、時間を決めて出題。解けた・解けなかったを記録して、解けなかったものだけやり直せる。</p><div class="prog">${testChip()}</div><span class="go">はじめる →</span></a>
  <div class="card"><h2>ごほうび</h2>${r.text ? `<div style="margin-bottom:6px">${esc(r.text)}（${need} pt）</div><div class="bar" aria-label="ごほうびまで"><i style="width:${pct}%"></i></div><div class="note" style="margin-top:4px">${have} / ${need} pt（合計）</div>${have >= need ? '<div class="fb ok">ポイントがたまりました。おうちの人に見せよう。</div>' : ''}` : '<div class="note">[ごほうびの中身は、おうちの人が決めます]</div>'}</div>
  <div class="card"><div class="note">学習のきろくは、この端末の中だけに保存されます。</div><div class="row" style="margin-top:8px"><button id="bparent">おうちの人向け</button></div></div>`;
  document.getElementById('bparent').addEventListener('click', renderGate);
}
function renderGate() {
  const a = 3 + Math.floor(Math.random() * 6), b = 4 + Math.floor(Math.random() * 6);
  gate = a * b;
  app.innerHTML = `<div class="row" style="margin-bottom:8px"><button id="bback">← もどる</button></div><h1>おうちの人向け</h1>
  <div class="card"><div class="note">子どもが設定を変えないための確認です。答えを入れてください。</div><div style="margin:8px 0;font-size:18px">${a} × ${b} ＝</div>
  <input id="gate" inputmode="numeric" aria-label="確認の答え"><div class="row" style="margin-top:8px"><button class="main" id="bgo">開く</button></div><div id="gm"></div></div>`;
  document.getElementById('bback').addEventListener('click', renderHub);
  document.getElementById('bgo').addEventListener('click', () => {
    if (+document.getElementById('gate').value === gate) renderParent(); else document.getElementById('gm').innerHTML = '<div class="fb ng">ちがいます。</div>';
  });
}
function renderParent(msg) {
  const r = reward(), z = zInfo(), j = jInfo(), need = Math.max(1, +r.need || 1), have = haveNow(r);
  app.innerHTML = `<div class="row" style="margin-bottom:8px"><button id="bback">← もどる</button></div><h1>おうちの人向け</h1>
  ${msg ? `<div class="fb ok" role="status">${esc(msg)}</div>` : ''}
  <div class="card"><h2>ごほうび（すべてのアプリで共通）</h2><label for="rt" class="note">ごほうびの中身</label><input id="rt" value="${esc(r.text)}" maxlength="40">
  <label for="rn" class="note" style="display:block;margin-top:8px">必要なポイント</label><input id="rn" type="number" inputmode="numeric" min="10" step="10" value="${esc(r.need)}">
  <div class="row" style="margin-top:10px"><button class="main" id="bsave">保存</button></div></div>
  <div class="card"><div class="note">ポイント：図形ミッション ${z.pt} ＋ 条件ハンター ${j.pt} ＋ 資料つなぎ ${sInfo().pt} ＋ 積み木の段数 ${tInfo().pt} ＋ ことば道場 ${kInfo().pt} ＋ ことばテンポ ${pInfo().pt} ＝ ${total()}（使った分 ${+r.spent || 0}、いま使えるのは ${have}）。ごほうびを渡したら、使います。</div>
  <div class="row" style="margin-top:8px"><button id="bspend" ${have >= need ? '' : 'disabled'}>ごほうびを渡した（${need} pt使う）</button></div></div>
  <div class="card"><div class="note">各アプリの記録のリセットは、それぞれのアプリの「おうちの人向け」にあります。</div></div>`;
  document.getElementById('bback').addEventListener('click', renderHub);
  document.getElementById('bsave').addEventListener('click', () => {
    const r2 = reward();
    r2.text = document.getElementById('rt').value.trim().slice(0, 40);
    r2.need = Math.max(10, +document.getElementById('rn').value || 300);
    saveReward(r2); renderParent('保存しました。');
  });
  document.getElementById('bspend').addEventListener('click', () => {
    const r2 = reward(), n = Math.max(1, +r2.need || 1);
    if (haveNow(r2) >= n) { r2.spent = (+r2.spent || 0) + n; saveReward(r2); renderParent(`${n} pt 使いました。`); }
  });
}
window.HUB = { zInfo, jInfo, sInfo, tInfo, kInfo, pInfo, reward, total, haveNow, renderHub };
renderHub();
</script>
</body>
</html>
