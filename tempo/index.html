<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>ことばテンポ</title>
<style>
:root{--bg:#F7F6F2;--card:#FFFFFF;--ink:#1F2430;--sub:#4A5160;--line:#D9D6CC;--blue:#1F4E79;--blue-soft:#E0EAF4;--org:#C2410C;--org-soft:#FBE7DE;--green:#2F6B3A;--green-soft:#E3F0E3;--gold:#6B4A06;--gold-soft:#F5ECD2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 8px}
a{color:var(--blue)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700}
.chip{padding:5px 10px;border-radius:99px}
.chip.pt{background:var(--gold-soft);color:var(--gold)}
.chip.box{background:var(--blue-soft);color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note{font-size:13px;color:var(--sub)}
button,.btnlink{font-family:inherit;font-size:16px;font-weight:700;min-height:50px;border-radius:10px;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:0 14px;cursor:pointer}
.btnlink{display:inline-flex;align-items:center;text-decoration:none;min-height:44px}
button.main{background:var(--blue);color:#fff}
button.org{background:var(--org);color:#fff;border-color:var(--org)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,label:focus-within{outline:3px solid #F59E0B;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:80px;text-align:center;border:1px solid var(--blue);border-radius:10px;padding:8px 6px;font-weight:700;font-size:14px;color:var(--blue);background:#fff;cursor:pointer;min-height:44px;display:flex;align-items:center;justify-content:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--blue);color:#fff}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue)}
.fb{border-radius:10px;padding:10px 12px;font-size:15px;margin:8px 0}
.fb.ok{background:var(--green-soft);border:1px solid var(--green);color:#1F3B25}
.fb.ng{background:var(--org-soft);border:1px solid var(--org);color:#7A2A08}
.stem{font-size:19px;line-height:1.7;margin:4px 0 6px}
.stem b{color:var(--blue)}
.kind{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--blue);color:#fff;margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opts button{text-align:left;padding:10px 14px;line-height:1.45;min-height:54px}
.opts button.right{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.opts button.wrong{background:var(--org-soft);border-color:var(--org);color:var(--org)}
.big{font-size:30px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.ok{color:var(--green);font-weight:700}
.ng{color:var(--org);font-weight:700}
</style>
</head>

const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };

/* ===================== 問題をつくる =====================
   mean：語 → 意味 ／ word：意味 → 語 ／ blank：例文の□に入る語 ／ hole：語の一部の□に入る字 */
function pick3(e, pool) {
  const out = [], seenMean = new Set([e.mean]), seenW = new Set([e.w]), seenGrp = new Set(e.grp ? [e.grp] : []);
  for (const x of shuffle(pool)) {
    if (seenW.has(x.w) || seenMean.has(x.mean) || (x.grp && seenGrp.has(x.grp))) continue;
    out.push(x); seenW.add(x.w); seenMean.add(x.mean); if (x.grp) seenGrp.add(x.grp);
    if (out.length === 3) break;
  }
  return out;
}
const sameCat = e => BANK.filter(x => x.cat === e.cat && x.id !== e.id);
const holeCands = e => BANK.filter(x => x.hole && x.id !== e.id && x.hole !== e.hole && x.hole.length === e.hole.length && x.cat === e.cat && !(e.grp && x.grp === e.grp));
function formsOf(e) { const f = ['mean', 'word']; if (e.ex) f.push('blank'); if (e.hole && new Set(holeCands(e).map(x => x.hole)).size >= 3) f.push('hole'); return f; }
function gen(e, fmt) {
  const pool = sameCat(e), d = pick3(e, pool);
  let stem, hint = '', opts, kind;
  if (fmt === 'mean') {
    kind = '意味はどれ？'; stem = `「<b>${esc(e.w)}</b>」の意味は？`;
    opts = [e.mean].concat(d.map(x => x.mean));
  } else if (fmt === 'word') {
    kind = 'ことばはどれ？'; stem = `つぎの意味にあてはまる${e.cat === '四字熟語' ? '四字熟語' : (e.cat === 'ことわざ' ? 'ことわざ' : (e.cat === '故事成語' ? '故事成語' : '慣用句'))}は？<br><b>${esc(e.mean)}</b>`;
    opts = [e.w].concat(d.map(x => x.w));
  } else if (fmt === 'blank') {
    kind = '文に入ることばは？'; stem = e.ex.replace(/《[^》]*》/, '<b>（　）</b>').replace(/[<>&]/g, c => c);
    stem = esc(e.ex).replace(/《[^》]*》/, '<b>（　）</b>');
    hint = '意味：' + e.mean;
    opts = [e.w].concat(d.map(x => x.w));
  } else {
    kind = '□に入る字は？';
    const shown = e.w.replace(e.hole, '□'.repeat(e.hole.length));
    stem = `「<b>${esc(shown)}</b>」の□に入ることばは？`; hint = '意味：' + e.mean;
    const cand = shuffle(holeCands(e));
    const out = [], seen = new Set([e.hole]);
    for (const x of cand) { if (seen.has(x.hole)) continue; out.push(x.hole); seen.add(x.hole); if (out.length === 3) break; }
    opts = [e.hole].concat(out);
  }
  const order = shuffle(opts.map((t, i) => ({ t, ok: i === 0 })));
  return { id: e.id, fmt, kind, stem, hint, opts: order.map(o => o.t), ans: order.findIndex(o => o.ok), e };
}

/* ===================== 出す順番 ===================== */
function pickWords(n) {
  const list = BANK.filter(e => S.cat === 'all' || e.cat === S.cat);
  const seen = list.filter(e => S.box[e.id] !== undefined), fresh = list.filter(e => S.box[e.id] === undefined);
  const scoreSeen = seen.map(e => ({ e, s: (4 - S.box[e.id]) + Math.random() * 1.2 })).sort((a, b) => b.s - a.s);
  const chosen = [];
  const newCount = Math.min(fresh.length, seen.length ? Math.min(4, n) : n);
  shuffle(fresh).slice(0, newCount).forEach(e => chosen.push(e));
  for (const x of scoreSeen) { if (chosen.length >= n) break; chosen.push(x.e); }
  for (const e of shuffle(fresh)) { if (chosen.length >= n) break; if (!chosen.includes(e)) chosen.push(e); }
  return shuffle(chosen).slice(0, n);
}
function chooseFmt(e, avoid) {
  const b = S.box[e.id] === undefined ? 0 : S.box[e.id], f = formsOf(e).filter(x => x !== avoid);
  const w = { mean: b <= 1 ? 3 : 1, hole: b <= 1 ? 2 : 1, word: b >= 2 ? 3 : 1, blank: b >= 2 ? 3 : 1 };
  const bag = []; f.forEach(x => { for (let i = 0; i < w[x]; i++) bag.push(x); });
  return bag[Math.floor(Math.random() * bag.length)] || f[0] || 'mean';
}

  app.innerHTML = `${head('ことばテンポ')}
  <p class="note" style="margin:0 0 10px">慣用句・ことわざ・故事成語・四字熟語を、1問ずつ、タップで答えるドリル。1回10問。まちがえた語は、その回のさいごと、あとの回にも出ます。</p>
  <div class="card"><h2>どれを練習する？</h2><div class="seg">${['all'].concat(CATS).map(c => `<label><input type="radio" name="cat" value="${c}" ${S.cat === c ? 'checked' : ''}><span>${c === 'all' ? 'ぜんぶ' : c}</span></label>`).join('')}</div>
  <div class="note" style="margin:8px 0 4px">覚えた：${cnt(S.cat)}（${sel.length}語から出ます）</div><div class="bar" aria-label="覚えた割合"><i style="width:${Math.round(sel.filter(e => (S.box[e.id] || 0) >= 3).length / Math.max(1, sel.length) * 100)}%"></i></div>
  <button class="main" id="bstart" style="width:100%;margin-top:12px">10問、はじめる</button></div>
  ${weak.length ? `<div class="card"><h2>まちがえたことば</h2><table>${weak.map(e => `<tr><td><b>${esc(e.w)}</b></td><td>${esc(e.mean)}</td></tr>`).join('')}</table></div>` : ''}
  <div class="card"><h2>きろく</h2><div class="note">練習した回数：${S.stat.ses}回　／　正解：${S.stat.ok} / ${S.stat.n}問（1回めで正解した数）</div>
  <div class="note" style="margin-top:6px">「覚えた」は、1回めで、つづけて3回正解したことばです。まちがえると、はじめにもどります。</div></div>
  <div class="card"><div class="note">学習のきろくは、この端末の中だけに保存されます。</div><div class="row" style="margin-top:8px"><button id="breset" class="${armed ? 'org' : ''}">${armed ? 'もう一度押すと、消えます' : 'きろくを消す'}</button></div></div>`;
  app.querySelectorAll('input[name=cat]').forEach(i => i.addEventListener('change', () => { S.cat = i.value; save(); renderHome(); }));
  document.getElementById('bstart').addEventListener('click', start);
  document.getElementById('breset').addEventListener('click', () => { if (!armed) { armed = true; renderHome(); return; } armed = false; S = blank(); save(); renderHome(); });
}
function start() {
  const words = pickWords(10);
  ses = { q: words.map(e => ({ e, fmt: chooseFmt(e), retry: false })), pos: 0, results: [], tries: {}, total: words.length, cur: null, answered: false, pts: 0 };
  next();
}
function next() {
  if (ses.pos >= ses.q.length) return renderEnd();
  const it = ses.q[ses.pos];
  ses.cur = gen(it.e, it.fmt); ses.cur.retry = it.retry; ses.answered = false;
  renderQ();
}
function renderQ() {
  const c = ses.cur, left = ses.q.length - ses.pos;
  app.innerHTML = `${head('', true)}
  <div class="card"><div class="bar" aria-label="進み具合"><i style="width:${Math.round(ses.pos / ses.q.length * 100)}%"></i></div>
  <div class="note" style="margin:6px 0">${ses.pos + 1} / ${ses.q.length} 問${c.retry ? '　（もう一度）' : ''}</div>
  <span class="kind">${c.kind}</span><div class="stem">${c.stem}</div>${c.hint ? `<div class="note">${esc(c.hint)}</div>` : ''}
  <div class="opts">${c.opts.map((t, i) => `<button data-i="${i}">${esc(t)}</button>`).join('')}</div>
  <div id="fb"></div></div>`;
  document.getElementById('bhome').addEventListener('click', () => { if (confirm0()) { ses = null; renderHome(); } });
  app.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => answer(+b.dataset.i)));
}
function confirm0() { return true; }
function answer(i) {
  if (ses.answered) return;
  const c = ses.cur, e = c.e, right = i === c.ans, first = !(e.id in ses.tries);
  ses.answered = true;
  const btns = app.querySelectorAll('.opts button');
  btns.forEach((b, k) => { b.disabled = true; if (k === c.ans) b.classList.add('right'); else if (k === i) b.classList.add('wrong'); });
  if (first) {
    ses.tries[e.id] = right;
    S.stat.n++; if (right) { S.stat.ok++; ses.pts++; S.pt++; }
    S.box[e.id] = right ? Math.min(4, (S.box[e.id] || 0) + 1) : 0;
    ses.results.push({ e, ok: right });
    if (!right) ses.q.push({ e, fmt: chooseFmt(e, c.fmt), retry: true });
    save();
  }
  const fb = document.getElementById('fb');
  fb.innerHTML = `<div class="fb ${right ? 'ok' : 'ng'}" role="status">${right ? '<b>正解！</b>' : '<b>ざんねん。</b>'}<br><b>${esc(e.w)}</b>（${esc(e.yomi)}）：${esc(e.mean)}${!right && e.ex ? `<br><span class="note">${esc(e.ex.replace(/[《》]/g, ''))}</span>` : ''}</div><div class="row"><button class="main" id="bnext">つぎへ</button></div>`;
  document.getElementById('bnext').addEventListener('click', () => { ses.pos++; next(); });
  document.getElementById('bnext').focus();
  if (right) { clearTimeout(ses.t); ses.t = setTimeout(() => { if (ses && ses.cur === c && ses.answered) { ses.pos++; next(); } }, 900); }
}
function renderEnd() {
  const ok_ = ses.results.filter(r => r.ok).length, n = ses.results.length, ng = ses.results.filter(r => !r.ok);
  S.stat.ses++; save();
  app.innerHTML = `${head('おわり', true)}
  <div class="card"><div class="big">${ok_} <span style="font-size:18px">/ ${n} 問　1回めで正解</span></div><div class="bar" style="margin:8px 0"><i style="width:${Math.round(ok_ / Math.max(1, n) * 100)}%"></i></div>
  <div class="note">+${ses.pts} pt　／　覚えた：${known()} / ${BANK.length}</div></div>
  ${ng.length ? `<div class="card"><h2>まちがえたことば</h2><table>${ng.map(r => `<tr><td><b>${esc(r.e.w)}</b><div class="note">${esc(r.e.yomi)}</div></td><td>${esc(r.e.mean)}</td></tr>`).join('')}</table></div>` : '<div class="fb ok">ぜんぶ、1回めで正解！</div>'}
  <div class="row"><button class="main" id="bagain">もう10問</button><button id="bhome2">ホームへ</button></div>`;
  document.getElementById('bhome').addEventListener('click', () => { ses = null; renderHome(); });
  document.getElementById('bhome2').addEventListener('click', () => { ses = null; renderHome(); });
  document.getElementById('bagain').addEventListener('click', start);
}
window.TP = { BANK, gen, formsOf, pickWords, get S() { return S; }, get ses() { return ses; }, start, renderHome };
renderHome();
</script>
</body>
