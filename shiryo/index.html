<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>資料つなぎ</title>
<style>
:root{--bg:#F7F6F2;--card:#FFFFFF;--ink:#1F2430;--sub:#4A5160;--line:#D9D6CC;--blue:#1F4E79;--blue-soft:#E0EAF4;--org:#C2410C;--org-soft:#FBE7DE;--green:#2F6B3A;--green-soft:#E3F0E3;--gold:#6B4A06;--gold-soft:#F5ECD2;--l0:#1F4E79;--l1:#C2410C;--l2:#2F6B3A;--l3:#7A3E9D}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:0 0 8px}
a{color:var(--blue)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:700}
.chip{padding:5px 10px;border-radius:99px}
.chip.pt{background:var(--gold-soft);color:var(--gold)}
.chip.box{background:var(--blue-soft);color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.note{font-size:13px;color:var(--sub)}
button,.btnlink{font-family:inherit;font-size:15px;font-weight:700;min-height:46px;border-radius:10px;border:1px solid var(--blue);background:#fff;color:var(--blue);padding:0 14px;cursor:pointer}
.btnlink{display:inline-flex;align-items:center;text-decoration:none}
button.main{background:var(--blue);color:#fff;border-color:var(--blue)}
button.org{background:var(--org);color:#fff;border-color:var(--org)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #F59E0B;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.grid5{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stg{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.stg h2{margin:0}
.stg .lv{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--blue);color:#fff}
.stg.lock .lv{background:#8A8F9A}
.mis{min-height:54px;font-size:18px}
.mis.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.steps{display:flex;gap:4px;margin:8px 0}
.st{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;line-height:1.2;color:var(--sub);padding:0 2px}
.st.now{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.st.ok{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:700}
.fb{border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.fb.ok{background:var(--green-soft);border:1px solid var(--green);color:#1F3B25}
.fb.ng{background:var(--org-soft);border:1px solid var(--org);color:#7A2A08}
.fb.hint{background:var(--gold-soft);border:1px solid #C9A24A;color:var(--gold)}
.paper{border-top:1px dashed #B8B4A8;margin-top:10px;padding-top:8px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.back{min-height:44px;padding:0 10px}
.task{background:#FFF8E5;border:1px solid #C9A24A;border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.tk{display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.5}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px;background:#6B4A06;color:#fff}
.tag.act{background:#1F4E79}
.prob{font-size:17px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.qbox{border:2px solid var(--ink);border-radius:4px;padding:1px 4px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{text-align:left;padding:10px 14px;line-height:1.45}
.opts button.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.chk{width:100%;text-align:left;padding:10px 14px;line-height:1.45;margin-bottom:8px}
.chk.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.ans{font-size:20px}
.calc{margin:6px 0 0;padding-left:0;list-style:none;font-size:15px;line-height:1.8}
/* 2つの資料 */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.dn{font-size:13px;font-weight:700;color:var(--blue);margin:0 0 6px}
.dr{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:54px;margin-bottom:6px;padding:6px 8px;text-align:left;font-size:14px;line-height:1.35;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:400}
.dr:last-child{margin-bottom:0}
.dr .t{min-width:0;overflow-wrap:anywhere}
.dr .t b{display:block;font-size:15px}
.dr .n{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:transparent}
.dr.sel{border-color:#F59E0B;background:#FFF8E5}
.dr.hint{box-shadow:0 0 0 3px #F59E0B}
.dr.l0{border-color:var(--l0);background:#EAF1F8}.dr.l0 .n{background:var(--l0)}
.dr.l1{border-color:var(--l1);background:#FBEDE5}.dr.l1 .n{background:var(--l1)}
.dr.l2{border-color:var(--l2);background:#E9F3E9}.dr.l2 .n{background:var(--l2)}
.dr.l3{border-color:var(--l3);background:#F1E9F6}.dr.l3 .n{background:var(--l3)}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
// テストモード（?test=1）：テストページから開かれたとき。時間制限つきで1問だけ出し、結果をテストページに返す。記録は変えない
const TEST = (function () {
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('test') !== '1') return null;
    return { k: q.get('k') || '', i: +q.get('i'), lim: +q.get('lim') || 300, rid: q.get('rid') || '', pos: +q.get('pos') || 0, n: +q.get('n') || 1 };
  } catch (e) { return null; }
})();
/* ===================== 問題 =====================
   A＝資料1、B＝資料2。pr[i]＝資料1のi番目とつながる、資料2の番号。chk[i]＝i番目の組の書き出し */
const P = [
  {

    q: '人口密度（1km²あたりの人口）がいちばん高い町は、どこですか。',

    B: { name: '資料2　町の面積', rows: [['C町', '5km²'], ['A町', '3km²'], ['B町', '4km²']] },
    pr: [1, 2, 0],
    forms: ['□町（町の名前）', '□人/km²（人口密度）', '□人（人口）'], form: 0,
    rel: { opts: ['人口と面積を、たす', '人口を面積でわる（1km²あたりの人口）', '面積を人口でわる'], ans: 1, hint: '密度は「1km²あたり」の人口。' },
    ans: ['A町', 'B町', 'C町', 'どの町も同じ'], right: 0,
    why: { 2: 'C町は、人口がいちばん多いだけ。面積でわって、1km²あたりで比べよう。', 1: 'B町は 8000÷4＝2000。ほかの町のほうが高いよ。', 3: '町ごとに、密度はちがうよ。' },
    chk: ['A町：12000÷3＝4000人/km²', 'B町：8000÷4＝2000人/km²', 'C町：15000÷5＝3000人/km²']
  },
  {
    title: '1人あたりの金額',
    q: '1人あたりに集めた金額がいちばん少ない組の、1人あたりの金額は何円ですか。',

    pr: [1, 2, 0],
    forms: ['□円（1人あたりの金額）', '□円（集めた金額）', '□組'], form: 0,
    rel: { opts: ['金額を人数でわる', '金額に人数をかける', '金額から人数をひく'], ans: 0, hint: '「1人あたり」→ 全体を人数でわる。' },
    ans: ['75円', '100円', '90円', '3000円'], right: 0,
    why: { 1: '100円は1組。いちばん「少ない」組を選ぼう。', 2: '90円は3組。もっと少ない組があるよ。', 3: '3000円は2組が集めた金額。1人あたりにするには、人数でわるよ。' },
    chk: ['1組：2400÷24＝100円', '2組：3000÷40＝75円', '3組：2700÷30＝90円']
  },
  {

    q: 'お客さんの声がいちばん多かった理由に応える工夫には、1か月にいくらかかりますか。',

    pr: [1, 0, 2],
    forms: ['□万円（費用）', '□人（声の数）', '□つ（工夫の数）'], form: 0,

    ans: ['200円', '150円', '800円', '40円'], right: 0,
    why: { 1: '150円はりんご。いちばん高いのは別の果物だよ。', 2: '800円は、ももの「1kgの値段」。1個ぶんは250gだけだよ。', 3: '40円はみかん。いちばん安いよ。' },
    chk: ['りんご：0.3kg×500円＝150円', 'みかん：0.1kg×400円＝40円', 'もも：0.25kg×800円＝200円']

  {
    title: 'ふえた人数',
    q: '去年より人数がいちばんふえたクラブは、何人ふえましたか。',

    B: { name: '資料2　今年の人数', rows: [['合唱', '21人'], ['野球', '20人'], ['サッカー', '36人']] },

    q: '人数がいちばん多い係は、何係ですか。',

  if (!stageOpen(P[i].stage)) return;
  route = { page: 'm', i };
  ui = { step: 0, tries: [0, 0, 0, 0], stat: [false, false, false, false, false], links: {}, sel: null, msg: null, formPick: null, relPick: null, ansPick: null, chk: {}, hintA: null, fin: false };
  render();
}
// 資料の1行。リンクがあれば番号と色がつく
function docRows(p, side, interactive) {
  const D = side === 'A' ? p.A : p.B;
  return D.rows.map((r, k) => {
    let n = -1;
    Object.keys(ui.links).forEach(a => { if (side === 'A' ? +a === k : ui.links[a] === k) n = +a; });
    const cls = ['dr'];
    if (n >= 0) cls.push('l' + n);
    if (side === 'A' && ui.sel === k) cls.push('sel');
    if (side === 'A' && ui.hintA === k) cls.push('hint');
    const inner = `<span class="t"><b>${esc(r[0])}</b>${esc(r[1])}</span><span class="n" aria-hidden="true">${n >= 0 ? CIRC[n] : ''}</span>`;
    const lab = n >= 0 ? `${r[0]} ${r[1]}（組${n + 1}）` : `${r[0]} ${r[1]}`;
    return interactive
      ? `<button class="${cls.join(' ')}" data-act="${side === 'A' ? 'ra' : 'rb'}" data-k="${k}" aria-label="${esc(lab)}">${inner}</button>`
      : `<div class="${cls.join(' ')}" aria-label="${esc(lab)}">${inner}</div>`;
  }).join('');
}
const showBtn = pts => `<div class="row" style="margin-top:8px"><button data-act="show">答えを見る（${pts}）</button></div>`;
function renderM() {
  const i = route.i, p = P[i];
  const fb = ui.msg ? `<div class="fb ${ui.msg.k}" role="status">${esc(ui.msg.t)}</div>` : '';
  const T = [
    { ask: 'この問題は、<b>何を、どんな形で</b>答える？', act: '問いの文を読んで、答えの形をえらぶ。（紙では、余白に「答：＿」と書いて、四角でかこむ）' },
    { ask: '2つの資料に、<b>同じものについて書いてある項目</b>がある。', act: '資料1の項目をタップ → 資料2の項目をタップで、つなぐ。同じ番号がつくよ。もう一度タップで外せる。', hint: '並び順は同じとは限らない。紙では、線か矢印で結んで、組に番号を書く。' },
    { ask: 'つないだ組を、<b>どう使う</b>？', act: '正しいものをえらぶ。' },
    { ask: '組ごとに計算して、問いに合う答えは？', act: '紙で計算して、答えを下からえらぶ。', hint: '問いの「いちばん」「何を」に注意。' },
    { ask: '<b>最後の見直し。</b>組ごとに、計算を1行ずつ書いた？', act: '組を1つずつ、指でなぞって、✓をつける。' }
  ];
  let body = '';
  if (ui.fin) {
    body = `<div class="fb ok"><b>クリア！</b> 宝箱が開きました。${ui.bonus ? `ボーナス +${ui.bonus} pt` : ''}${ui.stageClear ? ` <b>ステージクリア！ +${STAGE_BONUS} pt</b>` : ''}</div>
      <div class="card"><div class="note">組ごとの書き出し（1行ずつ、ラベルをつける）</div><ul class="calc">${p.chk.map(c => `<li>${esc(c)}</li>`).join('')}</ul><div style="margin-top:6px" class="ans">答：<b>${esc(p.ans[p.right])}</b></div></div>
      <div class="paper note">紙に戻る：答えの形に四角。同じ項目を線で結んで、組に番号。組ごとの計算を1行ずつ。</div>
      <div class="row" style="margin-top:8px"><button data-act="home">ホームへ</button>${i < P.length - 1 && stageOpen(P[i + 1].stage) ? `<button class="main" data-act="start" data-i="${i + 1}">次のミッション</button>` : ''}</div>`;
  } else if (ui.step === 0) {
    body = `${fb}<div class="card"><div class="opts">${p.forms.map((f, k) => `<button data-act="form" data-k="${k}" ${ui.formPick === k ? 'class="main"' : ''}>${esc(f)}</button>`).join('')}</div>${showBtn('0 pt')}</div>`;
  } else if (ui.step === 1) {
    body = `${fb}<div class="card"><div class="note">いま：${ui.sel === null ? '資料1の項目をえらんでください' : '資料2で、同じものの項目をえらんでください'}</div>
      <div class="row" style="margin-top:8px"><button class="org" data-act="linkdone">つなげた</button></div>${showBtn('0 pt')}</div>`;
  } else if (ui.step === 2) {
    body = `${fb}<div class="card"><div class="cq" style="font-size:15px;margin-bottom:8px">つないだ組から、何をする？</div><div class="opts">${p.rel.opts.map((o, k) => `<button data-act="rel" data-k="${k}" ${ui.relPick !== null && k === p.rel.ans ? 'class="ok" disabled' : ''}>${esc(o)}</button>`).join('')}</div>${showBtn('0 pt')}</div>`;
  } else if (ui.step === 3) {
    body = `${fb}<div class="card"><div class="opts">${p.ans.map((a, k) => `<button data-act="ans" data-k="${k}" ${ui.ansPick === k ? 'class="main"' : ''}>${esc(a)}</button>`).join('')}</div>${showBtn('0 pt')}</div>`;
  } else {
    body = `${fb}<div class="card"><div class="ans">答：<b>${esc(p.ans[p.right])}</b></div></div>${p.chk.map((c, k) => `<button class="chk ${ui.chk[k] ? 'done' : ''}" data-act="chk" data-k="${k}">${ui.chk[k] ? '✓' : '□'} <b>${CIRC[k]}</b> ${esc(c)}</button>`).join('')}`;
  }
  const inter = ui.step === 1 && !ui.fin;
  const showLinks = ui.step >= 1 || ui.fin;
  const savedLinks = ui.links;
  if (!showLinks) ui.links = {};
  const docs = `<div class="docs"><div class="doc"><div class="dn">${esc(p.A.name)}</div>${docRows(p, 'A', inter)}</div><div class="doc"><div class="dn">${esc(p.B.name)}</div>${docRows(p, 'B', inter)}</div></div>`;
  ui.links = savedLinks;
  app.innerHTML = `${head(`ステージ${p.stage + 1}　${i - STAGES[p.stage].from + 1} / ${STAGES[p.stage].n}　${p.title}`, true)}
  ${stepBar(ui.fin ? 5 : ui.step, ui.stat)}${ui.fin ? '' : taskCard(T[ui.step])}
  <div class="prob"><span class="${ui.step >= 1 || ui.fin ? 'qbox' : ''}">${esc(p.q)}</span></div>
  ${docs}
  ${body}`;
}

/* ---------- 進行 ---------- */
function passForm() { ui.stat[0] = true; ui.step = 1; ui.msg = { k: 'ok', t: `答えの形は「${P[route.i].forms[P[route.i].form]}」。問いの文に、四角をつけたよ。` }; }
function passLinks() { const pt = award(ui.tries[1]); ui.stat[1] = true; ui.step = 2; ui.sel = null; ui.hintA = null; ui.msg = { k: 'ok', t: `組がぜんぶ見つかった！ +${pt} pt` }; }
function passRel() { const pt = award(ui.tries[2]); ui.stat[2] = true; ui.step = 3; ui.msg = { k: 'ok', t: `使い方がわかった！ +${pt} pt` }; }
function passAns() { const p = P[route.i], pt = award(ui.tries[3]); ui.stat[3] = true; ui.step = 4; ui.msg = { k: 'ok', t: `正解！ ${p.ans[p.right]} +${pt} pt。最後に、組ごとの計算を確かめよう。` }; }
function finish() {
  const wasNew = !S.done[route.i];
  if (wasNew) S.done[route.i] = 1;
  S.chest = S.done.reduce((a, b) => a + b, 0);
  const clean = ui.tries.every(t => t === 0);
  ui.bonus = (wasNew && clean) ? 10 : 0; S.pt += ui.bonus;
  const sg = P[route.i].stage;
  if (!S.sb[sg] && stageDone(sg) === stageIds(sg).length) { S.sb[sg] = 1; S.pt += STAGE_BONUS; ui.stageClear = true; }
  S.stat.mT++; if (ui.tries[1] === 0) S.stat.mF++;
  S.stat.aT++; if (ui.tries[3] === 0) S.stat.aF++;
  save(); ui.stat[4] = true; ui.fin = true;
}
function tapA(k) {
  ui.msg = null; ui.hintA = null;
  if (ui.sel === k) { ui.sel = null; return render(); }
  delete ui.links[k];
  ui.sel = k;
  render();
}
function tapB(k) {
  ui.msg = null; ui.hintA = null;
  if (ui.sel === null) {
    const a = Object.keys(ui.links).find(x => ui.links[x] === k);
    if (a !== undefined) delete ui.links[a]; else ui.msg = { k: 'hint', t: 'まず、資料1の項目をえらぼう。' };
    return render();
  }
  Object.keys(ui.links).forEach(a => { if (ui.links[a] === k) delete ui.links[a]; });
  ui.links[ui.sel] = k; ui.sel = null;
  render();
}
function linkDone() {
  const p = P[route.i];
  let wrong = 0, missing = 0, first = null;
  p.A.rows.forEach((_, a) => {
    if (ui.links[a] === undefined) { missing++; if (first === null) first = a; }
    else if (ui.links[a] !== p.pr[a]) { wrong++; if (first === null || ui.links[first] === undefined) first = a; }
  });
  if (!wrong && !missing) return passLinks(), render();
  ui.tries[1]++;
  const parts = [];
  if (wrong) parts.push(`つなぎちがいが${wrong}組あるよ。同じものについて書いてある項目かな`);
  if (missing) parts.push(`まだつないでいない項目が${missing}つあるよ`);
  ui.msg = { k: 'ng', t: parts.join('。') + '。' };
  if (ui.tries[1] >= 2) { ui.hintA = first; ui.msg.t += '（光っているところを見てみよう）'; }
  render();
}
function showAnswer() {
  const p = P[route.i];
  if (ui.step === 0) { ui.formPick = p.form; return passForm(), render(); }
  if (ui.step === 1) { p.pr.forEach((b, a) => { ui.links[a] = b; }); ui.tries[1] = Math.max(ui.tries[1], 3); return passLinks(), render(); }
  if (ui.step === 2) { ui.relPick = p.rel.ans; ui.tries[2] = Math.max(ui.tries[2], 3); return passRel(), render(); }
  if (ui.step === 3) { ui.ansPick = p.right; ui.tries[3] = Math.max(ui.tries[3], 3); return passAns(), render(); }
}
function mAction(a, el) {
  const p = P[route.i];
  if (a === 'ra') return ui.step === 1 ? tapA(+el.dataset.k) : undefined;
  if (a === 'rb') return ui.step === 1 ? tapB(+el.dataset.k) : undefined;
  if (a === 'linkdone') return linkDone();
  if (a === 'show') return showAnswer();
  if (a === 'form') {
    const k = +el.dataset.k; ui.formPick = k;
    if (k === p.form) { passForm(); } else { ui.tries[0]++; ui.msg = { k: 'ng', t: '問いの文を、もう一度読もう。「何を」「どんな形で」答える？' }; }
    return render();
  }
  if (a === 'rel') {
    const k = +el.dataset.k;
    if (k === p.rel.ans) { ui.relPick = k; passRel(); } else { ui.tries[2]++; ui.msg = { k: 'ng', t: `もう一度。${p.rel.hint}` }; }
    return render();
  }
  if (a === 'ans') {
    const k = +el.dataset.k; ui.ansPick = k;
    if (k === p.right) { passAns(); } else { ui.tries[3]++; ui.msg = { k: 'ng', t: p.why[k] || 'もう一度。組ごとの計算を、見直そう。' }; }
    return render();
  }
  if (a === 'chk') {
    const k = +el.dataset.k; ui.chk[k] = !ui.chk[k]; ui.msg = null;
    if (p.chk.every((_, x) => ui.chk[x])) finish();
    return render();
  }
}

/* ---------- おうちの人向け ---------- */
function renderParent() {
  const a = 3 + Math.floor(Math.random() * 6), b = 4 + Math.floor(Math.random() * 6);
  ui = { gate: a * b };
  app.innerHTML = `${head('おうちの人向け', true)}
  <div class="card"><div class="note">子どもが設定を変えないための確認です。答えを入れてください。</div><div style="margin:8px 0;font-size:18px">${a} × ${b} ＝</div>
  <input id="gate" inputmode="numeric" style="width:100%;min-height:46px;font-size:18px;padding:0 10px;border:1px solid var(--line);border-radius:10px" aria-label="確認の答え"><div class="row" style="margin-top:8px"><button class="main" data-act="gate">開く</button></div><div id="gm"></div></div>`;
}
function renderParentOpen() {
  const st = S.stat;
  app.innerHTML = `${head('おうちの人向け', true)}
  <div class="card"><h2>きろく</h2><div class="note">ポイント：${S.pt}　クリア：${S.chest} / ${P.length}<br>資料のつなぎが、1回で通った：${st.mF} / ${st.mT}<br>答えが、1回で正解：${st.aF} / ${st.aT}</div>
  <div class="note" style="margin-top:6px">紙の答案でも、「資料の同じ項目を線で結んだ設問の割合」を数えると、変化が見えます。</div></div>
  <div class="card"><div class="note">ごほうびの設定とポイントの使用は、入口ページの「おうちの人向け」で行います（ポイントはすべてのアプリで合算）。</div></div>
  <div class="card"><div class="note">ステージを、すぐ開けたいときは、下のボタンを押します（クリアの記録は変わりません）。</div><div class="row" style="margin-top:8px"><button data-act="openall">ぜんぶのステージを開く</button></div></div>
  <div class="card"><div class="note">この画面の記録だけを消します（元に戻せません）。</div><div class="row" style="margin-top:8px"><button data-act="preset">全部リセット</button></div></div>`;
}

/* ---------- 入力 ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'home') { route = { page: 'home' }; ui = {}; return render(); }
  if (a === 'start') return startM(+el.dataset.i);
  if (a === 'parent') { route = { page: 'parent' }; return renderParent(); }
  if (a === 'gate') { const v = +document.getElementById('gate').value; if (v === ui.gate) renderParentOpen(); else document.getElementById('gm').innerHTML = '<div class="fb ng">ちがいます。</div>'; return; }
  if (a === 'openall') { S.open = true; save(); el.textContent = '開きました'; el.disabled = true; return; }
  if (a === 'preset') { if (!ui.armed) { ui.armed = true; el.textContent = 'もう一度押すと、全部消えます'; el.classList.add('org'); return; } S = blank(); save(); route = { page: 'home' }; ui = {}; return render(); }
  if (route.page === 'm') return mAction(a, el);
});
window.SY = { P, STAGES, stageOpen, stageDone, stageIds, get S() { return S; }, get ui() { return ui; }, startM, render };
/* ---------- テストモード ---------- */
function testBoot() {
  if (!TEST) return false;
  S.open = true;   // この画面だけ。保存はしない（save()が何もしない）
  const css = document.createElement('style');
  css.textContent = '#tbar{position:fixed;top:0;left:0;right:0;z-index:50;background:#1F2430;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;font-size:14px}#tbar b{font-size:20px;font-variant-numeric:tabular-nums}#tbar button{min-height:36px;background:#fff;color:#1F2430;border:0;font-size:13px;padding:0 10px}body{padding-top:58px}.back,.entry,[data-act="home"],[data-act="show"],[data-act="parent"],[data-act="start"],[data-act="cut"],[data-act="net"],[data-act="ref"],[data-act="aux"],.paper{display:none!important}#tov{position:fixed;inset:0;z-index:60;background:rgba(31,36,48,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:26px;font-weight:700;text-align:center;padding:20px}#tov button{font-size:16px;min-height:46px;padding:0 18px;border-radius:10px;border:0;background:#fff;color:#1F2430}';
  document.head.appendChild(css);
  const bar = document.createElement('div');
  bar.id = 'tbar';
  bar.innerHTML = '<span>テスト <b id="tno"></b></span><span>のこり <b id="tleft"></b></span><button id="tgive" type="button">あきらめる</button>';
  document.body.insertBefore(bar, document.body.firstChild);
  document.getElementById('tno').textContent = (TEST.pos + 1) + ' / ' + TEST.n;
  const key = 'tstart:' + TEST.rid + ':' + TEST.pos;
  let t0 = 0;
  try { t0 = +sessionStorage.getItem(key) || 0; } catch (e) {}
  if (!t0) { t0 = Date.now(); try { sessionStorage.setItem(key, String(t0)); } catch (e) {} }
  let over = false, armed = false;
  function report(res, msg) {
    if (over) return;
    over = true;
    const secs = Math.min(TEST.lim, Math.round((Date.now() - t0) / 1000));
    const mist = Array.isArray(ui.tries) ? ui.tries.reduce((a, b) => a + (+b || 0), 0) : 0;
    try {
      const d = JSON.parse(localStorage.getItem('jishu-test-v1') || '{}');
      if (d.cur && d.cur.id === TEST.rid && d.cur.items[TEST.pos] && d.cur.items[TEST.pos].status === 'todo') {
        d.cur.items[TEST.pos].status = res; d.cur.items[TEST.pos].secs = secs; d.cur.items[TEST.pos].mist = mist;
        localStorage.setItem('jishu-test-v1', JSON.stringify(d));
      }
    } catch (e) {}
    const ov = document.createElement('div');
    ov.id = 'tov';
    ov.innerHTML = '<div>' + msg + '</div><button id="tback" type="button">テストにもどる</button>';
    document.body.appendChild(ov);
    const go = () => { location.href = '../test/?r=' + encodeURIComponent(TEST.rid); };
    document.getElementById('tback').addEventListener('click', go);
    setTimeout(go, 1800);
  }
  document.getElementById('tgive').addEventListener('click', ev => {
    if (!armed) { armed = true; ev.target.textContent = 'もう一度で、やめる'; setTimeout(() => { armed = false; ev.target.textContent = 'あきらめる'; }, 3000); return; }
    report('fail', 'あきらめた');
  });
  function tick() {
    if (over) return;
    const left = Math.max(0, TEST.lim - (Date.now() - t0) / 1000);
    document.getElementById('tleft').textContent = Math.floor(left / 60) + ':' + String(Math.floor(left % 60)).padStart(2, '0');
    if (ui && ui.fin) report('solved', '解けた！');
    else if (left <= 0) report('fail', '時間切れ');
  }
  startM(TEST.i);
  tick();
  setInterval(tick, 400);
  return true;
}
if (!testBoot()) render();
</script>
